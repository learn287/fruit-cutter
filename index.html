<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Fruit Cutter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0d0f12;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 95vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border: 3px solid #2a2e39;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      touch-action: none;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13, 15, 18, 0.88);
      backdrop-filter: blur(8px);
      padding: 20px;
      text-align: center;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: linear-gradient(45deg, #ff4757, #ffa502, #2ed573);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: #a4b0be;
      margin-bottom: 20px;
      max-width: 500px;
    }

    .showcase-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      max-width: 550px;
    }

    .fruit-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
    }

    .fruit-card .icon {
      font-size: 1.5rem;
    }

    .btn-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2ed573, #10ac84);
      color: #fff;
      box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
    }

    .score-badge {
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      margin-bottom: 25px;
      color: #fffa65;
      font-weight: 700;
    }

    #loading-indicator {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #00ffff;
      z-index: 5;
    }
  </style>
</head>

  <body>
  <!-- MediaPipe CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <div id="game-container">
    <div id="loading-indicator">Initializing Camera & AI Model...</div>

    <video id="webcam" playsinline></video>
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- Home Screen -->
    <div id="home-screen" class="overlay">
      <h1>AI FRUIT CUTTER</h1>
      <p class="subtitle">Use your <b>index finger</b> as a blade in front of your camera to slice fruits!</p>

      <div class="showcase-grid">
        <div class="fruit-card"><span class="icon">🍉</span> <span>Watermelon (+1)</span></div>
        <div class="fruit-card"><span class="icon">🍊</span> <span>Orange (+1)</span></div>
        <div class="fruit-card"><span class="icon">🍋</span> <span>Lemon (+1)</span></div>
        <div class="fruit-card"><span class="icon">🥝</span> <span>Kiwi (+1)</span></div>
        <div class="fruit-card" style="border-color: rgba(255, 71, 87, 0.4);"><span class="icon">💣</span> <span style="color:#ff6b81;">Bomb (Instant Loss)</span></div>
      </div>

      <button id="btn-start" class="btn btn-primary">
        <span>▶</span> Start Game
      </button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden">
      <h1 style="background: linear-gradient(45deg, #ff4757, #ff6b81); -webkit-background-clip: text;">GAME OVER</h1>
      <div id="final-score" class="score-badge">Score: 0</div>

      <div class="btn-group">
        <button id="btn-restart" class="btn btn-danger">
          <span>🔄</span> Play Again
        </button>
        <button id="btn-home" class="btn btn-secondary">
          <span>🏠</span> Home
        </button>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const loadingText = document.getElementById('loading-indicator');

    const homeScreen = document.getElementById('home-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreDisplay = document.getElementById('final-score');
    const btnStart = document.getElementById('btn-start');
    const btnRestart = document.getElementById('btn-restart');
    const btnHome = document.getElementById('btn-home');
    // --- GAME STATE ---
    let gameState = 'HOME'; // 'HOME', 'PLAYING', 'GAMEOVER'
    let score = 0;
    let lives = 3;
    let spawnTimer = 0;
    const baseGravity = 0.42;

    const trail = [];
    const maxTrailLength = 8;
    const spawnables = [];
    const particles = [];
    const fruitColors = ['#ff4757', '#ffa502', '#2ed573', '#eccc68'];

    // Gradual speed multiplier after 10 points
    function getSpeedMultiplier() {
      if (score < 10) return 1.0;
      // Increases by ~3.5% per point above 10, capped at 2.2x speed
      return Math.min(2.2, 1.0 + (score - 10) * 0.035);
    }

    class Spawnable {
      constructor() {
        const mult = getSpeedMultiplier();
        const speedScale = Math.sqrt(mult);

        this.radius = Math.floor(Math.random() * 10) + 28;
        this.x = Math.random() * (canvas.width - 2 * this.radius - 80) + this.radius + 40;
        this.y = canvas.height + this.radius;
        
        // Speed scales up smoothly with score
        this.vx = (Math.random() - 0.5) * 5.5 * speedScale;
        this.vy = -(Math.random() * 4 + 14.5) * speedScale;
        this.gravity = baseGravity * mult;

        this.isBomb = Math.random() < 0.2;
        this.color = this.isBomb ? '#1e272e' : fruitColors[Math.floor(Math.random() * fruitColors.length)];
        this.sliced = false;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
      }
      draw(c) {
        if (this.sliced) return;
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        c.fillStyle = this.color;
        c.fill();
        c.lineWidth = 3;
        c.strokeStyle = this.isBomb ? '#ff4757' : '#ffffff';
        c.stroke();

        if (this.isBomb) {
          c.beginPath();
          c.arc(this.x, this.y - this.radius + 4, 4, 0, Math.PI * 2);
          c.fillStyle = '#ff4757';
          c.fill();
        } else {
          c.beginPath();
          c.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
          c.fillStyle = 'rgba(255,255,255,0.4)';
          c.fill();
        }
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 11;
        this.vy = (Math.random() - 0.5) * 11;
        this.radius = Math.random() * 4 + 3;
        this.life = 25;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        this.radius = Math.max(0, this.radius - 0.15);
      }
      draw(c) {
        if (this.life <= 0) return;
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        c.fillStyle = this.color;
        c.fill();
      }
    }

    function lineIntersectsCircle(p1, p2, circle) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.hypot(circle.x - p1.x, circle.y - p1.y) <= circle.radius;
      const t = Math.max(0, Math.min(1, ((circle.x - p1.x) * dx + (circle.y - p1.y) * dy) / lenSq));
      const closeX = p1.x + t * dx;
      const closeY = p1.y + t * dy;
      return Math.hypot(circle.x - closeX, circle.y - closeY) <= circle.radius;
    }

    function resetGameData() {
      score = 0;
      lives = 3;
      spawnTimer = 0;
      spawnables.length = 0;
      particles.length = 0;
      trail.length = 0;
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      finalScoreDisplay.textContent = `Score: ${score}`;
      gameOverScreen.classList.remove('hidden');
    }

    // --- NAVIGATION EVENTS ---
    btnStart.addEventListener('click', () => {
      resetGameData();
      homeScreen.classList.add('hidden');
      gameState = 'PLAYING';
    });

    btnRestart.addEventListener('click', () => {
      resetGameData();
      gameOverScreen.classList.add('hidden');
      gameState = 'PLAYING';
    });

    btnHome.addEventListener('click', () => {
      resetGameData();
      gameOverScreen.classList.add('hidden');
      homeScreen.classList.remove('hidden');
      gameState = 'HOME';
    });
    // --- MEDIAPIPE FRAME HANDLER ---
    function onResults(results) {
      if (loadingText.style.display !== 'none') {
        loadingText.style.display = 'none';
      }

      // 1. Mirrored Camera Feed
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.scale(-1, 1);
      ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Index Fingertip Tracking (Landmark 8)
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const indexTip = results.multiHandLandmarks[0][8];
        const screenX = (1 - indexTip.x) * canvas.width;
        const screenY = indexTip.y * canvas.height;
        trail.unshift({ x: screenX, y: screenY });
        if (trail.length > maxTrailLength) trail.pop();
      } else {
        trail.length = 0;
      }

      // 3. Active Game Engine
      if (gameState === 'PLAYING') {
        spawnTimer++;

        // Fruits also spawn faster after 10 points (from 45 frames down to 24 frames)
        const spawnInterval = Math.max(24, Math.floor(45 - Math.max(0, score - 10) * 0.7));
        if (spawnTimer % spawnInterval === 0) {
          spawnables.push(new Spawnable());
        }

        if (trail.length >= 2) {
          const p1 = trail[0];
          const p2 = trail[1];
          for (let obj of spawnables) {
            if (!obj.sliced && lineIntersectsCircle(p1, p2, obj)) {
              obj.sliced = true;
              for (let i = 0; i < 16; i++) {
                particles.push(new Particle(obj.x, obj.y, obj.color));
              }
              if (obj.isBomb) {
                triggerGameOver();
              } else {
                score++;
              }
            }
          }
        }

        for (let i = spawnables.length - 1; i >= 0; i--) {
          const obj = spawnables[i];
          obj.update();
          if (obj.y > canvas.height + 60 && !obj.sliced) {
            if (!obj.isBomb) {
              lives--;
              if (lives <= 0) triggerGameOver();
            }
            spawnables.splice(i, 1);
          } else if (obj.sliced) {
            spawnables.splice(i, 1);
          }
        }
      }

      // 4. Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      particles.forEach(p => p.draw(ctx));

      // 5. Draw Game Objects
      if (gameState === 'PLAYING') {
        spawnables.forEach(obj => obj.draw(ctx));
      }

      // 6. Draw Blade Trail
      if (trail.length > 1) {
        for (let i = 0; i < trail.length - 1; i++) {
          ctx.beginPath();
          ctx.moveTo(trail[i].x, trail[i].y);
          ctx.lineTo(trail[i + 1].x, trail[i + 1].y);
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = (maxTrailLength - i) * 2;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }

      // 7. HUD Display (Shows speed bonus indicator after 10 pts)
      if (gameState === 'PLAYING') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(`Score: ${score}`, 25, 45);

        if (score >= 10) {
          ctx.font = '14px sans-serif';
          ctx.fillStyle = '#fffa65';
          ctx.fillText(`Speed: ${(getSpeedMultiplier()).toFixed(1)}x`, 25, 70);
        }

        ctx.fillStyle = '#ff4757';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(`Lives: ${'♥ '.repeat(Math.max(0, lives))}`, canvas.width - 160, 45);
      }
    }

    // --- INITIALIZE MEDIAPIPE ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.55,
      minTrackingConfidence: 0.55
    });
    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      facingMode: 'user',
      width: { ideal: 960 },
      height: { ideal: 540 }
    });
    camera.start();
  </script>
</body>
</html>
